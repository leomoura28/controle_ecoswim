<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Controle de Evento</title>
    <link rel="stylesheet" href="style.css">    
</head>
<body>
    <header>
        <h1> Controle de Entrada - Ecoswim </h1>
        <button class="btn-atualizar" onclick="carregarDados()">🔄 Atualizar Dados</button>
    </header>

    <div class="busca-container" id="buscaContainer" style="display: none;">
        <input 
            type="text" 
            id="inputBusca" 
            placeholder="🔍 Buscar por nome, ID ou kit..." 
            oninput="filtrarPessoas()"
        />
        <span class="busca-resultado" id="resultadoBusca"></span>
    </div>

    <div class="contador" id="contador" style="display: none;">
        <div class="contador-item">
            <span class="contador-numero" id="total">0</span>
            <span>Total</span>
        </div>
        <div class="contador-item">
            <span class="contador-numero" id="presentes" style="color: #10b981;">0</span>
            <span>Não Chegaram</span>
        </div>
        <div class="contador-item">
            <span class="contador-numero" id="ausentes" style="color: #0f4c82;">0</span>
            <span>Chegaram</span>
        </div>
    </div>
    
    <div id="container" class="container"></div>

    <script>
        const API_BASE_URL = 'https://rfaazro0f3.execute-api.us-east-1.amazonaws.com';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzu0ATV02HGmeLiE5S44HgZ6iIhoqbyocC2TKY5RL7yE1GVy1CJJiurzGIvJc8f4n2hRA/exec';

        let pessoas = [];

        async function carregarDados() {
            const container = document.getElementById('container');
            container.innerHTML = '<div class="loading">⏳ Carregando dados...</div>';
            
            try {
                const response = await fetch(API_BASE_URL + '/horarios');
                const csvData = await response.text();
                processarCSV(csvData);
            } catch (error) {
                console.error('Erro:', error);
                container.innerHTML = `<div class="error">❌ Erro ao carregar dados: ${error.message}</div>`;
            }
        }

        function processarCSV(csvText) {
            const linhas = csvText.trim().split('\n');
            
            const container = document.getElementById('container');
            container.innerHTML = '';
            pessoas = [];

            // Pula o cabeçalho (linha 1)
            for (let i = 1; i < linhas.length; i++) {
                const colunas = parseCSVLine(linhas[i]);
                
                if (colunas.length < 4) {
                    console.warn(`⚠️ Linha ${i} ignorada - menos de 4 colunas:`, colunas);
                    continue;
                }

                const idEquipe = colunas[0].trim();
                const nome = colunas[1].trim();
                const equipe = colunas[2].trim();
                const status = parseInt(colunas[3].trim());

                const pessoa = {
                    linha: i + 1, // linha na planilha (considerando cabeçalho)
                    idEquipe,
                    nome,
                    equipe,
                    status
                };
                pessoas.push(pessoa);
                criarCard(pessoa);
            }
            atualizarContadores();
            document.getElementById('contador').style.display = 'block';
            document.getElementById('buscaContainer').style.display = 'flex';
        }

        function filtrarPessoas() {
            const busca = document.getElementById('inputBusca').value.toLowerCase().trim();
            let resultados = [];

            if (busca === '') {
                pessoas.forEach(pessoa => {
                    const card = document.getElementById(`card-${pessoa.linha}`);
                    if (card) card.classList.remove('oculto');
                });
                document.getElementById('resultadoBusca').textContent = `${pessoas.length} pessoas`;
                return;
            }

            const buscaNormalizada = normalizarTexto(busca);

            pessoas.forEach(pessoa => {
                const card = document.getElementById(`card-${pessoa.linha}`);
                if (!card) return;

                const scoreNome = calcularScore(normalizarTexto(pessoa.nome), buscaNormalizada);
                const scoreId = calcularScore(normalizarTexto(pessoa.idEquipe), buscaNormalizada);
                const scoreEquipe = calcularScore(normalizarTexto(pessoa.equipe), buscaNormalizada);

                const melhorScore = Math.max(scoreNome, scoreId, scoreEquipe);

                if (melhorScore > 0) {
                    card.classList.remove('oculto');
                    resultados.push({ pessoa, score: melhorScore });
                } else {
                    card.classList.add('oculto');
                }
            });

            resultados.sort((a, b) => b.score - a.score);

            const container = document.getElementById('container');
            resultados.forEach(({ pessoa }) => {
                const card = document.getElementById(`card-${pessoa.linha}`);
                if (card) container.appendChild(card);
            });

            document.getElementById('resultadoBusca').textContent = `${resultados.length} encontrados`;
        }

        function normalizarTexto(texto) {
            return texto
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^\w\s]/g, '');
        }

        function calcularScore(texto, busca) {
            if (texto === busca) return 1000;
            if (texto.startsWith(busca)) return 500;
            if (texto.includes(busca)) return 250;

            let score = 0, pos = 0;
            for (let i = 0; i < busca.length; i++) {
                const idx = texto.indexOf(busca[i], pos);
                if (idx !== -1) {
                    score += 10;
                    pos = idx + 1;
                    if (i > 0 && idx === pos) score += 5;
                } else score -= 5;
            }
            return Math.max(0, score);
        }

        function calcularDistanciaLevenshtein(str1, str2) {
            const m = str1.length;
            const n = str2.length;
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 0; i <= m; i++) dp[i][0] = i;
            for (let j = 0; j <= n; j++) dp[0][j] = j;

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (str1[i - 1] === str2[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1];
                    } else {
                        dp[i][j] = Math.min(
                            dp[i - 1][j] + 1,    // deletar
                            dp[i][j - 1] + 1,    // inserir
                            dp[i - 1][j - 1] + 1 // substituir
                        );
                    }
                }
            }

            return dp[m][n];
        }

        function criarCard(pessoa) {
            const container = document.getElementById('container');
            
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${pessoa.linha}`;
            
            const statusClass = pessoa.status === 0 ? 'status-presente' : 'status-ausente';
            const statusTexto = pessoa.status === 0 ? 'Não Chegou' : ' Chegou ';
            
            // Cria elementos separadamente para garantir que o evento funcione
            card.innerHTML = `
                <div class="nome">${pessoa.nome}</div>
                <div class="info">
                    <span>👥 <span class="badge">${pessoa.idEquipe}</span></span>
                    <span>KIT <span class="badge">${pessoa.equipe}</span></span>
                </div>
            `;
            
            // Cria o botão separadamente e adiciona o evento
            const btn = document.createElement('button');
            btn.className = `btn-toggle ${statusClass}`;
            btn.textContent = statusTexto;
            btn.addEventListener('click', () => {
                
                // Adiciona loading
                btn.disabled = true;
                btn.classList.add('btn-loading');
                const textoOriginal = btn.textContent;
                
                toggleStatus(pessoa.linha).finally(() => {
                    // Remove loading depois de 2 segundos (tempo pra receber callback)
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.classList.remove('btn-loading');
                        // Se o callback não atualizou, restaura o texto
                        if (btn.textContent === '') {
                            btn.textContent = textoOriginal;
                        }
                    }, 6000);
                });
            });
            
            card.appendChild(btn);
            container.appendChild(card);
        }

        async function toggleStatus(linha) {
            
            try {
                const url = `${APPS_SCRIPT_URL}?row=${linha}&callback=atualizarInterface`;
                // JSONP
                const script = document.createElement('script');
                script.src = url;
                document.head.appendChild(script);
                // Remove script após uso
                setTimeout(() => {
                    script.remove();
                }, 5000);
                
            } catch (error) {
                console.error('🔴 Erro ao toggle status:', error);
                alert('❌ Erro ao atualizar status');
            }
        }

        function atualizarInterface(resp) {
            
            if (resp.sucesso) {
                
                const pessoa = pessoas.find(p => p.linha === resp.linha);
                if (pessoa) {
                    pessoa.status = resp.depois;
                } else {
                    console.warn('⚠️ Pessoa não encontrada no array para linha:', resp.linha);
                }

                const card = document.getElementById(`card-${resp.linha}`);
                if (card) {
                    const btn = card.querySelector('.btn-toggle');
                    
                    // Remove loading
                    btn.disabled = false;
                    btn.classList.remove('btn-loading');
                    
                    // Remove classes antigas
                    btn.classList.remove('status-presente', 'status-ausente');
                    
                    // Adiciona nova classe e texto
                    if (resp.depois === 0) {
                        btn.classList.add('status-presente');
                        btn.textContent = '✓ Não Chegou';
                    } else {
                        btn.classList.add('status-ausente');
                        btn.textContent = '✗ Chegou';
                    }
                    
                    atualizarContadores();
                } else {
                    console.error('🔴 Card não encontrado:', `card-${resp.linha}`);
                }
            } else {
                console.error('🔴 Resposta com erro:', resp.error);
                alert('❌ Erro: ' + resp.error);
            }
        }

        function atualizarContadores() {
            const total = pessoas.length;
            const presentes = pessoas.filter(p => p.status === 0).length;
            const ausentes = pessoas.filter(p => p.status === 1).length;

            document.getElementById('total').textContent = total;
            document.getElementById('presentes').textContent = presentes;
            document.getElementById('ausentes').textContent = ausentes;
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            
            result.push(current);
            return result;
        }

        // Carrega automaticamente ao abrir
        window.onload = carregarDados;
    </script>
</body>
</html>
